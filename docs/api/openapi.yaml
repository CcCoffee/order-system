openapi: 3.0.3

info:
  title: Order System API
  version: 1.0.0

paths:

  /api/orders:
    post:
      summary: Create order
      responses:
        '201':
          description: Created

  /api/orders/{orderId}/cancel:
    post:
      summary: Cancel order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancelled
        '404':
          description: Order not found
        '409':
          description: Order cannot be cancelled
